<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>VPN Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/realm-web@1.5.0/dist/bundle.iife.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white font-sans antialiased min-h-screen">
    <div id="app" class="p-4 max-w-md mx-auto pb-20">
        <!-- Content will be injected by app.js -->
        <div id="loader" class="flex flex-col justify-center items-center h-[80vh]">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mb-4"></div>
            <p class="text-gray-400 animate-pulse">Loading...</p>
        </div>
    </div>

    <!-- Navigation Bar -->
    <nav id="navbar" class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 hidden">
        <div class="flex justify-around items-center h-16 max-w-md mx-auto">
            <button onclick="router.navigate('home')" class="nav-item flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-blue-500 focus:text-blue-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span class="text-xs mt-1">Home</span>
            </button>
            <button onclick="router.navigate('shop')" class="nav-item flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-blue-500 focus:text-blue-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                </svg>
                <span class="text-xs mt-1">Shop</span>
            </button>
            <button onclick="router.navigate('profile')" class="nav-item flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-blue-500 focus:text-blue-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span class="text-xs mt-1">Profile</span>
            </button>
        </div>
    </nav>
    <script src="app.js"></script>
</body>
</html>
