<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPN Bot Mini App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/realm-web/dist/realm.production.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
  <div id="app" class="container mx-auto p-4 max-w-md">
    <!-- Loading -->
    <div id="loading" class="text-center mt-10">
      <p class="text-lg animate-pulse">Loading...</p>
    </div>

    <!-- Login Error -->
    <div id="error" class="hidden text-center mt-10 p-4 bg-red-100 rounded text-red-700">
      <p id="error-msg">Error</p>
      <button onclick="location.reload()" class="mt-2 text-sm underline">Retry</button>
    </div>

    <!-- Home View -->
    <div id="view-home" class="hidden view fade-in">
      <div class="bg-white p-6 rounded-lg shadow-md mb-4">
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-2xl font-bold">VPN Bot</h1>
            <span id="user-name" class="text-sm text-gray-500">User</span>
        </div>

        <div class="mb-6 text-center">
            <p class="text-gray-500 text-sm uppercase tracking-wide">Balance</p>
            <p class="text-4xl font-bold text-gray-800"><span id="user-balance">0</span> ₽</p>
        </div>

        <div id="subscription-status" class="mb-4 p-3 bg-blue-50 rounded text-sm text-blue-800 flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
          <span id="sub-text">Checking subscription...</span>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button id="btn-topup" class="bg-green-500 text-white py-3 rounded-lg font-medium hover:bg-green-600 transition shadow-sm">Top Up</button>
            <button id="btn-buy" class="bg-blue-500 text-white py-3 rounded-lg font-medium hover:bg-blue-600 transition shadow-sm">Buy VPN</button>
        </div>
      </div>

      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-xl font-bold mb-4 border-b pb-2">My Configs</h2>
        <div id="configs-list" class="space-y-3">
          <!-- Configs will be injected here -->
          <p class="text-gray-500 text-sm italic text-center py-4">You have no active configurations.</p>
        </div>
      </div>
    </div>

    <!-- Buy View -->
    <div id="view-buy" class="hidden view slide-up">
      <div class="flex items-center mb-6">
          <button class="mr-4 text-gray-500 hover:text-gray-800 back-btn" data-target="view-home">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
          </button>
          <h2 class="text-2xl font-bold">Select Plan</h2>
      </div>
      <div id="plans-list" class="space-y-4">
        <!-- Plans injected here -->
      </div>
    </div>

    <!-- Topup View -->
    <div id="view-topup" class="hidden view slide-up">
      <div class="flex items-center mb-6">
          <button class="mr-4 text-gray-500 hover:text-gray-800 back-btn" data-target="view-home">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
          </button>
          <h2 class="text-2xl font-bold">Top Up Balance</h2>
      </div>

      <div class="bg-white p-6 rounded-lg shadow-md">
        <label class="block mb-2 text-sm font-bold text-gray-700">Amount (₽)</label>
        <input type="number" id="topup-amount" class="w-full p-3 border rounded-lg mb-4 text-lg" placeholder="100" min="50" value="100">

        <div class="grid grid-cols-3 gap-2 mb-6">
          <button class="bg-gray-100 hover:bg-gray-200 py-2 rounded-lg font-medium amount-preset transition" data-amount="100">100 ₽</button>
          <button class="bg-gray-100 hover:bg-gray-200 py-2 rounded-lg font-medium amount-preset transition" data-amount="300">300 ₽</button>
          <button class="bg-gray-100 hover:bg-gray-200 py-2 rounded-lg font-medium amount-preset transition" data-amount="500">500 ₽</button>
        </div>

        <button id="btn-pay" class="w-full bg-green-500 text-white py-3 rounded-lg font-bold hover:bg-green-600 transition shadow-md flex justify-center items-center gap-2">
            <span>Pay with Yookassa</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        </button>
      </div>
    </div>

    <!-- Payment Status View -->
    <div id="view-payment" class="hidden view text-center slide-up">
        <div class="bg-white p-8 rounded-lg shadow-md mt-10">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
            <h2 class="text-2xl font-bold mb-2">Payment Pending</h2>
            <p class="text-gray-600 mb-6">Please complete the payment in the new window.</p>
            <div id="payment-status" class="text-lg font-bold text-yellow-600 mb-6 bg-yellow-50 py-2 rounded">Waiting...</div>

            <button id="btn-check-payment" class="w-full bg-blue-500 text-white py-3 rounded-lg font-medium hover:bg-blue-600 transition mb-4">Check Status</button>
            <button class="text-gray-500 hover:text-gray-800 back-btn" data-target="view-home">Back to Home</button>
        </div>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
