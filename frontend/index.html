<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VPN Bot Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/realm-web@2.0.0/dist/bundle.iife.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        .tg-button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .tg-hint {
            color: var(--tg-theme-hint-color, #999999);
        }
        .tg-secondary-bg {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        .slide-up {
            animation: slideUp 0.5s ease-out forwards;
        }

        .view-section {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .view-section.active {
            display: block;
            opacity: 1;
        }

        /* Custom scrollbar for configs list */
        .configs-list::-webkit-scrollbar {
            width: 4px;
        }
        .configs-list::-webkit-scrollbar-thumb {
            background-color: var(--tg-theme-hint-color, #ccc);
            border-radius: 4px;
        }
    </style>
</head>
<body class="antialiased min-h-screen p-4 flex flex-col">

    <!-- Loading Screen -->
    <div id="loading" class="view-section active flex-grow flex-col items-center justify-center fade-in" style="display: flex;">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2" style="border-color: var(--tg-theme-button-color, #2481cc);"></div>
        <p class="mt-4 tg-hint text-sm">Инициализация...</p>
    </div>

    <!-- Main Profile View -->
    <div id="profileView" class="view-section slide-up w-full max-w-md mx-auto">

        <!-- Header / User Info -->
        <div class="text-center mb-6">
            <h1 id="userName" class="text-2xl font-bold mb-1">Пользователь</h1>
            <p id="userUsername" class="tg-hint text-sm">@username</p>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="tg-secondary-bg rounded-2xl p-4 text-center shadow-sm">
                <p class="tg-hint text-xs mb-1 uppercase tracking-wider">Баланс</p>
                <p id="userBalance" class="text-xl font-bold">0 ₽</p>
            </div>
            <div class="tg-secondary-bg rounded-2xl p-4 text-center shadow-sm">
                <p class="tg-hint text-xs mb-1 uppercase tracking-wider">Рефералы</p>
                <p id="userReferrals" class="text-xl font-bold">0</p>
            </div>
        </div>

        <!-- Subscription Status -->
        <div class="tg-secondary-bg rounded-2xl p-5 mb-6 shadow-sm border border-opacity-10" style="border-color: var(--tg-theme-hint-color, #ccc);">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-lg font-semibold">Подписка</h2>
                <span id="subStatusBadge" class="px-2 py-1 rounded text-xs font-bold bg-red-100 text-red-600">Неактивна</span>
            </div>
            <p id="subEndDate" class="tg-hint text-sm mb-4">Нет активной подписки</p>

            <button onclick="showTopUpView()" class="w-full tg-button rounded-xl py-3 font-semibold mb-2 transition hover:opacity-90">
                Пополнить баланс
            </button>
            <button onclick="showBuyView()" class="w-full bg-transparent border-2 rounded-xl py-2 font-semibold transition" style="border-color: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-color, #2481cc);">
                Купить подписку
            </button>
        </div>

        <!-- My Configs -->
        <div>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-semibold">Мои конфиги</h2>
                <span id="configsCount" class="tg-hint text-sm">0</span>
            </div>
            <div id="configsList" class="configs-list space-y-3 max-h-60 overflow-y-auto pr-1">
                <!-- Configs will be inserted here -->
            </div>
        </div>

    </div>

    <!-- Top Up View -->
    <div id="topUpView" class="view-section slide-up w-full max-w-md mx-auto">
        <div class="flex items-center mb-6">
            <button onclick="showProfileView()" class="p-2 -ml-2 tg-hint hover:opacity-70 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <h1 class="text-xl font-bold flex-grow text-center pr-6">Пополнение</h1>
        </div>

        <p class="mb-4 tg-hint text-sm text-center">Выберите сумму для пополнения баланса</p>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <button onclick="setTopUpAmount(100)" class="tg-secondary-bg rounded-xl py-4 font-semibold hover:opacity-80 transition text-lg">100 ₽</button>
            <button onclick="setTopUpAmount(200)" class="tg-secondary-bg rounded-xl py-4 font-semibold hover:opacity-80 transition text-lg">200 ₽</button>
            <button onclick="setTopUpAmount(500)" class="tg-secondary-bg rounded-xl py-4 font-semibold hover:opacity-80 transition text-lg">500 ₽</button>
            <button onclick="setTopUpAmount(1000)" class="tg-secondary-bg rounded-xl py-4 font-semibold hover:opacity-80 transition text-lg">1000 ₽</button>
        </div>

        <div class="mb-6 relative">
            <span class="absolute left-4 top-4 font-bold" style="color: var(--tg-theme-text-color, #000);">₽</span>
            <input type="number" id="customAmount" placeholder="Другая сумма" class="w-full tg-secondary-bg rounded-xl py-4 pl-10 pr-4 font-semibold outline-none focus:ring-2" style="color: var(--tg-theme-text-color, #000); background-color: var(--tg-theme-secondary-bg-color, #f0f0f0); --tw-ring-color: var(--tg-theme-button-color, #2481cc);" oninput="checkCustomAmount()">
        </div>

        <button id="payButton" onclick="processTopUp()" class="w-full tg-button rounded-xl py-3 font-semibold transition opacity-50 cursor-not-allowed" disabled>
            Оплатить
        </button>
    </div>

    <!-- Buy Subscription View -->
    <div id="buyView" class="view-section slide-up w-full max-w-md mx-auto">
        <div class="flex items-center mb-6">
            <button onclick="showProfileView()" class="p-2 -ml-2 tg-hint hover:opacity-70 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <h1 class="text-xl font-bold flex-grow text-center pr-6">Покупка подписки</h1>
        </div>

        <div class="tg-secondary-bg rounded-xl p-4 mb-6 flex justify-between items-center shadow-sm">
            <span class="font-semibold">Ваш баланс:</span>
            <span id="buyViewBalance" class="font-bold text-lg">0 ₽</span>
        </div>

        <p class="mb-4 tg-hint text-sm">Выберите период:</p>

        <div id="subscriptionOptions" class="space-y-3 mb-6">
            <!-- Options will be loaded dynamically -->
            <div class="text-center tg-hint text-sm py-4">Загрузка тарифов...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
