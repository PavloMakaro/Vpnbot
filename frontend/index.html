<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Mini App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Realm Web SDK -->
    <script src="https://unpkg.com/realm-web@2.0.0/dist/bundle.iife.js"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-up { animation: slideUp 0.3s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-10">
        <div>
            <h1 class="text-xl font-bold">VPN Bot</h1>
            <p class="text-xs text-blue-200" id="user-greeting">Loading...</p>
        </div>
        <div class="text-right">
            <p class="text-sm">Balance</p>
            <p class="font-bold text-lg"><span id="user-balance">0</span> ₽</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 max-w-md mx-auto space-y-6">

        <!-- Status Card -->
        <section class="bg-white rounded-xl shadow p-5 fade-in">
            <h2 class="text-lg font-semibold mb-2">Subscription Status</h2>
            <div id="subscription-status" class="flex items-center gap-3">
                <span class="inline-block w-3 h-3 rounded-full bg-gray-400" id="status-indicator"></span>
                <span id="status-text" class="text-gray-600">Checking...</span>
            </div>
            <p id="subscription-date" class="text-sm text-gray-500 mt-2 hidden"></p>
        </section>

        <!-- Navigation Tabs -->
        <nav class="flex rounded-lg overflow-hidden border border-gray-300 shadow-sm bg-white">
            <button id="tab-buy" class="flex-1 py-3 text-center font-medium bg-blue-50 text-blue-600 border-b-2 border-blue-600 transition-colors">
                Buy / Top Up
            </button>
            <button id="tab-configs" class="flex-1 py-3 text-center font-medium text-gray-500 hover:bg-gray-50 border-b-2 border-transparent transition-colors">
                My Configs
            </button>
        </nav>

        <!-- Buy Section -->
        <section id="section-buy" class="space-y-4 fade-in">
            <!-- Top Up Card -->
            <div class="bg-white rounded-xl shadow p-5 slide-up">
                <h3 class="font-semibold mb-3 flex items-center gap-2">
                    <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    Top Up Balance
                </h3>
                <div class="grid grid-cols-3 gap-2 mb-3">
                    <button class="topup-btn border border-gray-300 rounded-lg py-2 hover:bg-green-50 hover:border-green-300 transition-colors" data-amount="100">100 ₽</button>
                    <button class="topup-btn border border-gray-300 rounded-lg py-2 hover:bg-green-50 hover:border-green-300 transition-colors" data-amount="200">200 ₽</button>
                    <button class="topup-btn border border-gray-300 rounded-lg py-2 hover:bg-green-50 hover:border-green-300 transition-colors" data-amount="500">500 ₽</button>
                </div>
                <div class="flex gap-2">
                    <input type="number" id="custom-amount" placeholder="Custom amount" class="border border-gray-300 rounded-lg px-3 py-2 flex-1 outline-none focus:ring-2 focus:ring-green-300">
                    <button id="btn-topup-custom" class="bg-green-500 hover:bg-green-600 text-white rounded-lg px-4 py-2 transition-colors">Top Up</button>
                </div>
            </div>

            <!-- Subscriptions Card -->
            <div class="bg-white rounded-xl shadow p-5 slide-up" style="animation-delay: 0.1s;">
                <h3 class="font-semibold mb-3 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    Buy Subscription
                </h3>
                <div id="subscription-plans" class="space-y-3">
                    <div class="text-center text-gray-500 py-4">Loading plans...</div>
                </div>
            </div>
        </section>

        <!-- Configs Section -->
        <section id="section-configs" class="hidden space-y-4 fade-in">
            <div id="configs-list" class="space-y-3">
                <div class="text-center text-gray-500 py-4">Loading your configs...</div>
            </div>
        </section>

    </main>

    <!-- Overlay Spinner -->
    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-5 rounded-xl shadow-xl flex flex-col items-center">
            <svg class="animate-spin h-8 w-8 text-blue-600 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-sm font-medium text-gray-700" id="loading-text">Processing...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
