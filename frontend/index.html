<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VPN Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/realm-web@1.2.0/dist/bundle.iife.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            transition: background-color 0.3s, color 0.3s;
        }

        /* Custom Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f3f4f6);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--tg-theme-button-color, #3b82f6);
            color: var(--tg-theme-button-text-color, #ffffff);
            transition: opacity 0.2s;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        /* Loading Skeleton Animation */
        @keyframes pulse-light {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .skeleton {
            background-color: var(--tg-theme-hint-color, #d1d5db);
            animation: pulse-light 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Modern Spinner */
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top-color: var(--tg-theme-button-color, #3b82f6);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 select-none">

    <!-- Loading Screen with Beautiful Animation -->
    <div id="loading" class="fixed inset-0 flex flex-col items-center justify-center bg-[var(--tg-theme-bg-color)] z-50">
        <div class="spinner mb-4"></div>
        <div class="text-[var(--tg-theme-hint-color)] text-sm animate-pulse">Connecting securely...</div>
    </div>

    <!-- Main Container -->
    <div id="app-container" class="opacity-0 transition-opacity duration-500">

        <!-- Home View -->
        <div id="home-view" class="hidden space-y-5 fade-in">
            <!-- Profile Card -->
            <div class="card p-5 rounded-2xl shadow-sm border border-transparent">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h2 class="text-2xl font-bold" id="username">@user</h2>
                        <div class="text-sm text-[var(--tg-theme-hint-color)]">VPN User</div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs uppercase tracking-wide text-[var(--tg-theme-hint-color)]">Balance</div>
                        <div class="text-2xl font-bold text-[var(--tg-theme-button-color)]"><span id="balance">0</span> ₽</div>
                    </div>
                </div>
                <div class="bg-[var(--tg-theme-bg-color)] p-3 rounded-xl flex items-center justify-between">
                    <span class="text-sm font-medium">Status</span>
                    <span id="sub-status" class="px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-600">Inactive</span>
                </div>
            </div>

            <!-- Action Grid -->
            <div class="grid grid-cols-2 gap-4">
                <button onclick="router.navigate('shop')" class="card p-5 rounded-2xl shadow-sm flex flex-col items-center justify-center space-y-2 h-32 hover:shadow-md">
                    <span class="text-4xl">🚀</span>
                    <span class="font-bold text-lg">Buy VPN</span>
                </button>
                <button onclick="router.navigate('configs')" class="card p-5 rounded-2xl shadow-sm flex flex-col items-center justify-center space-y-2 h-32 hover:shadow-md">
                    <span class="text-4xl">📂</span>
                    <span class="font-bold text-lg">My Configs</span>
                </button>
            </div>

            <!-- Referral Button -->
            <button onclick="router.navigate('referral')" class="w-full card p-4 rounded-xl shadow-sm flex items-center justify-between hover:shadow-md">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">🤝</span>
                    <span class="font-bold">Referral Program</span>
                </div>
                <span class="text-[var(--tg-theme-hint-color)]">➔</span>
            </button>
        </div>

        <!-- Shop View -->
        <div id="shop-view" class="hidden space-y-5 fade-in">
            <!-- Header -->
            <div class="flex items-center space-x-3">
                <button onclick="router.back()" class="p-2 rounded-full hover:bg-[var(--tg-theme-secondary-bg-color)] transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 class="text-2xl font-bold">Store</h2>
            </div>

            <!-- Topup Section -->
            <div class="card p-5 rounded-2xl shadow-sm">
                <h3 class="font-bold mb-3 text-lg">Top Up Balance</h3>
                <div class="flex space-x-3 mb-3">
                    <input type="number" id="topup-amount" placeholder="Amount (RUB)" class="flex-1 p-3 rounded-xl bg-[var(--tg-theme-bg-color)] border border-gray-200 outline-none focus:border-[var(--tg-theme-button-color)] transition text-[var(--tg-theme-text-color)]">
                </div>
                <button onclick="app.topUp()" class="btn-primary w-full p-3 rounded-xl font-bold shadow-lg shadow-blue-500/30">
                    Pay via Yookassa
                </button>
            </div>

            <!-- Products -->
            <div>
                <h3 class="font-bold mb-3 text-lg px-1">Subscription Plans</h3>
                <div id="products-list" class="space-y-3">
                    <!-- Skeletons -->
                    <div class="card p-4 rounded-xl flex justify-between items-center animate-pulse">
                        <div class="space-y-2">
                            <div class="h-4 w-24 bg-gray-300 rounded"></div>
                            <div class="h-3 w-16 bg-gray-300 rounded"></div>
                        </div>
                        <div class="h-8 w-16 bg-gray-300 rounded"></div>
                    </div>
                     <div class="card p-4 rounded-xl flex justify-between items-center animate-pulse">
                        <div class="space-y-2">
                            <div class="h-4 w-24 bg-gray-300 rounded"></div>
                            <div class="h-3 w-16 bg-gray-300 rounded"></div>
                        </div>
                        <div class="h-8 w-16 bg-gray-300 rounded"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Configs View -->
        <div id="configs-view" class="hidden space-y-5 fade-in">
             <div class="flex items-center space-x-3">
                <button onclick="router.back()" class="p-2 rounded-full hover:bg-[var(--tg-theme-secondary-bg-color)] transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 class="text-2xl font-bold">My Configs</h2>
            </div>
            <div id="configs-list" class="space-y-3">
                <!-- Empty State will be injected here -->
            </div>
        </div>

        <!-- Referral View -->
        <div id="referral-view" class="hidden space-y-5 fade-in">
             <div class="flex items-center space-x-3">
                <button onclick="router.back()" class="p-2 rounded-full hover:bg-[var(--tg-theme-secondary-bg-color)] transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 class="text-2xl font-bold">Invite Friends</h2>
            </div>
            <div class="card p-6 rounded-2xl shadow-sm text-center">
                <div class="text-5xl mb-4">🎁</div>
                <h3 class="font-bold text-lg mb-2">Earn Bonuses</h3>
                <p class="text-sm text-[var(--tg-theme-hint-color)] mb-6">Invite friends and get free subscription days when they sign up!</p>

                <div onclick="app.copyReferral()" class="bg-[var(--tg-theme-bg-color)] p-4 rounded-xl mb-4 flex items-center justify-between cursor-pointer active:bg-gray-100 transition">
                    <span id="ref-link-container" class="text-sm truncate text-[var(--tg-theme-link-color)] flex-1 text-left mr-2">Loading...</span>
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </div>

                <div class="flex justify-center space-x-8 text-center">
                    <div>
                        <div class="text-2xl font-bold" id="ref-count">0</div>
                        <div class="text-xs text-[var(--tg-theme-hint-color)] uppercase">Referrals</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
