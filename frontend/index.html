<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VPN Bot Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/realm-web/dist/bundle.iife.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        .slide-up {
            animation: slideUp 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Themed elements based on TG color scheme */
        .card-bg {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .btn-primary {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            text-align: center;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--tg-theme-button-color, #3390ec);
            border: 1px solid var(--tg-theme-button-color, #3390ec);
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            text-align: center;
            width: 100%;
            transition: opacity 0.2s;
        }

        .loader {
            border: 3px solid var(--tg-theme-secondary-bg-color, #f3f3f3);
            border-top: 3px solid var(--tg-theme-button-color, #3498db);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4">

    <!-- Loading Screen -->
    <div id="loadingView" class="flex flex-col items-center justify-center h-screen fade-in">
        <div class="loader"></div>
        <p class="mt-4 font-semibold text-center">Загрузка данных...</p>
    </div>

    <!-- Main Profile View -->
    <div id="mainView" class="hidden fade-in pb-20">
        <h1 class="text-2xl font-bold mb-4">Личный кабинет</h1>

        <div class="card-bg slide-up">
            <h2 class="text-lg font-semibold mb-2">Статус</h2>
            <div id="statusBadge" class="inline-block px-3 py-1 rounded-full text-sm font-semibold mb-2 bg-red-100 text-red-800">Нет подписки</div>
            <p id="subscriptionInfo" class="text-sm opacity-80 mt-1"></p>
        </div>

        <div class="card-bg slide-up" style="animation-delay: 0.1s;">
            <h2 class="text-lg font-semibold mb-2">Баланс</h2>
            <p class="text-3xl font-bold"><span id="balanceAmount">0</span> ₽</p>
            <button id="btnTopup" class="btn-secondary mt-3">Пополнить баланс</button>
        </div>

        <div class="card-bg slide-up" style="animation-delay: 0.2s;">
            <h2 class="text-lg font-semibold mb-4">VPN Подписка</h2>
            <button id="btnBuySub" class="btn-primary">Купить / Продлить</button>
        </div>

        <div class="card-bg slide-up" style="animation-delay: 0.3s;" id="myConfigsContainer">
            <h2 class="text-lg font-semibold mb-4">Мои конфиги</h2>
            <div id="configsList" class="space-y-4">
                <!-- Config items injected here -->
            </div>
        </div>
    </div>

    <!-- Topup View -->
    <div id="topupView" class="hidden fade-in">
        <div class="flex items-center mb-6">
            <button id="btnBackFromTopup" class="mr-3 p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
            </button>
            <h1 class="text-2xl font-bold">Пополнение</h1>
        </div>

        <div class="card-bg">
            <p class="mb-4">Выберите сумму для пополнения (₽):</p>
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button class="btn-secondary topup-amount" data-amount="100">100 ₽</button>
                <button class="btn-secondary topup-amount" data-amount="200">200 ₽</button>
                <button class="btn-secondary topup-amount" data-amount="500">500 ₽</button>
                <button class="btn-secondary topup-amount" data-amount="1000">1000 ₽</button>
            </div>

            <p class="mb-2 text-sm opacity-80 mt-4">Своя сумма:</p>
            <input type="number" id="customAmount" class="w-full p-3 rounded-lg border focus:outline-none mb-4 text-black" placeholder="От 50 до 50000 ₽" min="50" max="50000">

            <button id="btnPayYookassa" class="btn-primary flex justify-center items-center">
                <span id="paySpinner" class="hidden loader !w-5 !h-5 !border-2 !border-white !border-t-transparent !m-0 !mr-2"></span>
                <span>Перейти к оплате</span>
            </button>
        </div>
    </div>

    <!-- Buy Subscription View -->
    <div id="buySubView" class="hidden fade-in">
        <div class="flex items-center mb-6">
            <button id="btnBackFromBuy" class="mr-3 p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
            </button>
            <h1 class="text-2xl font-bold">Покупка подписки</h1>
        </div>

        <div class="card-bg">
            <p class="mb-2">Ваш баланс: <strong id="buyBalance" class="text-lg">0 ₽</strong></p>

            <div id="plansContainer" class="mt-6 space-y-3">
                <div class="loader"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
