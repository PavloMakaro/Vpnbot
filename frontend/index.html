<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VPN Bot Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/realm-web@1.2.0/dist/bundle.iife.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white font-sans antialiased min-h-screen pb-20">

    <!-- Loading Screen -->
    <div id="loading" class="fixed inset-0 flex items-center justify-center bg-gray-900 z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
    </div>

    <!-- Main Content (Hidden initially) -->
    <div id="app" class="hidden p-4 space-y-6">

        <!-- Header / User Info -->
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-xl font-bold" id="user-name">User</h1>
                <p class="text-gray-400 text-sm">ID: <span id="user-id">...</span></p>
            </div>
            <div class="text-right">
                <div class="text-2xl font-bold text-green-400"><span id="user-balance">0</span> ₽</div>
                <div class="text-xs text-gray-500">Balance</div>
            </div>
        </div>

        <!-- Subscription Status Card -->
        <div class="bg-gray-800 rounded-xl p-4 shadow-lg border border-gray-700">
            <h2 class="text-gray-400 text-sm uppercase tracking-wider mb-2">Subscription</h2>
            <div id="sub-status" class="text-lg font-medium text-white mb-1">Checking...</div>
            <div id="sub-details" class="text-sm text-gray-500"></div>
        </div>

        <!-- Navigation Tabs (simulated) -->
        <div class="flex space-x-2 bg-gray-800 p-1 rounded-lg">
            <button onclick="switchTab('dashboard')" class="flex-1 py-2 rounded-md text-sm font-medium transition-colors bg-blue-600 text-white" id="tab-dashboard">Dashboard</button>
            <button onclick="switchTab('shop')" class="flex-1 py-2 rounded-md text-sm font-medium transition-colors text-gray-400 hover:text-white" id="tab-shop">Shop</button>
            <button onclick="switchTab('profile')" class="flex-1 py-2 rounded-md text-sm font-medium transition-colors text-gray-400 hover:text-white" id="tab-profile">My Configs</button>
        </div>

        <!-- Views Container -->
        <div id="views">

            <!-- Dashboard View -->
            <div id="view-dashboard" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="switchTab('shop')" class="bg-gradient-to-br from-blue-500 to-blue-700 p-4 rounded-xl shadow-lg transform active:scale-95 transition text-left">
                        <div class="text-2xl mb-1">🚀</div>
                        <div class="font-bold">Buy VPN</div>
                        <div class="text-xs opacity-75">High speed & secure</div>
                    </button>
                    <button onclick="showTopup()" class="bg-gradient-to-br from-green-500 to-green-700 p-4 rounded-xl shadow-lg transform active:scale-95 transition text-left">
                        <div class="text-2xl mb-1">💰</div>
                        <div class="font-bold">Top Up</div>
                        <div class="text-xs opacity-75">Add funds</div>
                    </button>
                </div>

                <!-- Topup Section (Hidden by default) -->
                <div id="topup-section" class="hidden bg-gray-800 rounded-xl p-4 border border-gray-700 animate-fade-in">
                    <h3 class="font-bold mb-3">Top Up Balance</h3>
                    <div class="grid grid-cols-3 gap-2 mb-4">
                        <button onclick="setTopupAmount(100)" class="bg-gray-700 py-2 rounded hover:bg-gray-600 transition">100₽</button>
                        <button onclick="setTopupAmount(300)" class="bg-gray-700 py-2 rounded hover:bg-gray-600 transition">300₽</button>
                        <button onclick="setTopupAmount(500)" class="bg-gray-700 py-2 rounded hover:bg-gray-600 transition">500₽</button>
                    </div>
                    <input type="number" id="custom-amount" placeholder="Enter amount (min 50)" class="w-full bg-gray-900 border border-gray-600 rounded p-2 mb-3 text-white focus:outline-none focus:border-blue-500">
                    <button onclick="initiatePayment()" class="w-full bg-green-600 py-3 rounded-lg font-bold hover:bg-green-500 transition">Pay with Yookassa</button>
                </div>
            </div>

            <!-- Shop View -->
            <div id="view-shop" class="hidden space-y-4">
                <h3 class="font-bold text-lg">Select Plan</h3>
                <div id="shop-list" class="space-y-3">
                    <!-- Items injected by JS -->
                    <div class="animate-pulse flex space-x-4">
                        <div class="flex-1 space-y-4 py-1">
                            <div class="h-20 bg-gray-700 rounded"></div>
                            <div class="h-20 bg-gray-700 rounded"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Profile View -->
            <div id="view-profile" class="hidden space-y-4">
                <h3 class="font-bold text-lg">My Configs</h3>
                <div id="configs-list" class="space-y-3">
                    <p class="text-gray-500 text-center py-4">No configs found.</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-xl border border-gray-600 transition-opacity opacity-0 pointer-events-none z-50">
        Message
    </div>

    <script src="app.js"></script>
</body>
</html>
