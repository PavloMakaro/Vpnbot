<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Bot Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/realm-web@2.0.0/dist/bundle.iife.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">
    <div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-20 fade-in">
        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 text-center rounded-b-xl shadow-md">
            <h1 class="text-2xl font-bold">VPN Dashboard</h1>
        </header>

        <!-- Loading Spinner -->
        <div id="loading" class="flex justify-center items-center py-10">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
        </div>

        <!-- Main Content -->
        <main id="content" class="p-4 hidden slide-up">
            <!-- Profile Section -->
            <section id="profile" class="mb-6 bg-gray-50 p-4 rounded-lg shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold mb-2 text-gray-700">Profile</h2>
                <div class="space-y-1 text-sm">
                    <p>Name: <span id="userName" class="font-medium"></span></p>
                    <p>Balance: <span id="userBalance" class="font-medium text-green-600"></span> RUB</p>
                    <p>Subscription: <span id="userSub" class="font-medium"></span></p>
                </div>
                <button id="topupBtn" class="mt-3 w-full bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded transition">
                    Top Up Balance
                </button>
            </section>

            <!-- Configs Section -->
            <section id="configs" class="mb-6">
                <h2 class="text-lg font-semibold mb-3 text-gray-700">Buy Subscription</h2>
                <div id="plansList" class="space-y-3">
                    <!-- Plans injected here -->
                </div>
            </section>

            <!-- My Configs -->
            <section id="myConfigs">
                <h2 class="text-lg font-semibold mb-3 text-gray-700">My Configurations</h2>
                <div id="myConfigsList" class="space-y-3">
                    <!-- User configs injected here -->
                </div>
            </section>
        </main>

        <!-- Topup Modal -->
        <div id="topupModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
            <div class="bg-white p-6 rounded-lg w-11/12 max-w-sm">
                <h3 class="text-lg font-bold mb-4">Top Up Amount</h3>
                <input type="number" id="topupAmount" class="w-full border rounded p-2 mb-4" placeholder="Amount in RUB">
                <div class="flex justify-end space-x-2">
                    <button id="cancelTopup" class="px-4 py-2 bg-gray-200 rounded">Cancel</button>
                    <button id="confirmTopup" class="px-4 py-2 bg-blue-600 text-white rounded">Proceed</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
