<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VPN Bot Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/realm-web@1.2.0/dist/bundle.iife.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-900 transition-colors duration-200">
    <div id="app" class="flex flex-col h-screen overflow-hidden">

        <!-- Loading Screen -->
        <div id="loader" class="absolute inset-0 z-50 flex items-center justify-center bg-white">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
        </div>

        <!-- Header -->
        <div class="bg-white shadow-md p-4 flex justify-between items-center z-10 header-bg">
            <div class="flex items-center space-x-2">
                <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold" id="user-avatar">
                    ?
                </div>
                <div>
                    <h1 class="font-bold text-lg" id="user-name">Loading...</h1>
                    <p class="text-xs text-gray-500">ID: <span id="user-id">...</span></p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-500">Баланс</p>
                <p class="font-bold text-green-600 text-lg"><span id="user-balance">0</span> ₽</p>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 overflow-y-auto p-4 space-y-6 pb-24" id="main-content">

            <!-- Subscription Status -->
            <div class="bg-white rounded-xl shadow p-4 card-bg">
                <h2 class="text-gray-500 text-sm uppercase tracking-wide mb-2">Статус подписки</h2>
                <div id="sub-status" class="flex items-center space-x-3">
                    <div class="w-3 h-3 rounded-full bg-red-500" id="sub-indicator"></div>
                    <span class="font-bold text-lg" id="sub-text">Не активна</span>
                </div>
                <p class="text-xs text-gray-400 mt-1" id="sub-date"></p>
            </div>

            <!-- Actions Grid -->
            <div class="grid grid-cols-2 gap-4">
                <button onclick="showPage('topup')" class="bg-blue-500 text-white p-4 rounded-xl shadow hover:bg-blue-600 transition flex flex-col items-center justify-center active:scale-95">
                    <span class="text-2xl mb-1">💳</span>
                    <span class="font-medium text-sm">Пополнить</span>
                </button>
                <button onclick="showPage('shop')" class="bg-purple-500 text-white p-4 rounded-xl shadow hover:bg-purple-600 transition flex flex-col items-center justify-center active:scale-95">
                    <span class="text-2xl mb-1">🚀</span>
                    <span class="font-medium text-sm">Купить VPN</span>
                </button>
            </div>

            <!-- My Configs Preview -->
            <div class="bg-white rounded-xl shadow p-4 card-bg">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-gray-500 text-sm uppercase tracking-wide">Мои конфиги</h2>
                    <button onclick="showPage('configs')" class="text-blue-500 text-sm font-medium">Все ></button>
                </div>
                <div id="configs-list-preview" class="space-y-2">
                    <p class="text-gray-400 text-sm text-center py-2">Нет активных конфигов</p>
                </div>
            </div>

        </div>

        <!-- Modals / Pages -->

        <!-- Shop Page -->
        <div id="page-shop" class="hidden absolute inset-0 bg-gray-100 z-20 flex flex-col page-transition">
            <div class="bg-white p-4 shadow flex items-center space-x-3 header-bg">
                <button onclick="hidePage('shop')" class="text-blue-500 font-bold text-xl">←</button>
                <h2 class="font-bold text-lg">Выбор тарифа</h2>
            </div>
            <div class="p-4 space-y-4 overflow-y-auto flex-1" id="shop-items">
                <!-- Items injected by JS -->
            </div>
        </div>

        <!-- Topup Page -->
        <div id="page-topup" class="hidden absolute inset-0 bg-gray-100 z-20 flex flex-col page-transition">
            <div class="bg-white p-4 shadow flex items-center space-x-3 header-bg">
                <button onclick="hidePage('topup')" class="text-blue-500 font-bold text-xl">←</button>
                <h2 class="font-bold text-lg">Пополнение баланса</h2>
            </div>
            <div class="p-6 space-y-6 flex-1">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Сумма (₽)</label>
                    <input type="number" id="topup-amount" class="w-full p-3 rounded-xl border border-gray-300 text-2xl font-bold text-center focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0">
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="setTopup(100)" class="bg-white p-2 rounded shadow text-sm font-bold border hover:bg-gray-50">100 ₽</button>
                    <button onclick="setTopup(300)" class="bg-white p-2 rounded shadow text-sm font-bold border hover:bg-gray-50">300 ₽</button>
                    <button onclick="setTopup(500)" class="bg-white p-2 rounded shadow text-sm font-bold border hover:bg-gray-50">500 ₽</button>
                </div>
                <button onclick="initiatePayment()" id="pay-btn" class="w-full bg-green-500 text-white p-4 rounded-xl font-bold text-lg shadow hover:bg-green-600 transition active:scale-95 mt-8">
                    Оплатить
                </button>
            </div>
        </div>

        <!-- Configs Page -->
        <div id="page-configs" class="hidden absolute inset-0 bg-gray-100 z-20 flex flex-col page-transition">
            <div class="bg-white p-4 shadow flex items-center space-x-3 header-bg">
                <button onclick="hidePage('configs')" class="text-blue-500 font-bold text-xl">←</button>
                <h2 class="font-bold text-lg">Мои конфигурации</h2>
            </div>
            <div class="p-4 space-y-4 overflow-y-auto flex-1" id="configs-full-list">
                <!-- Configs injected by JS -->
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
