<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Mini App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Realm Web SDK -->
    <script src="https://unpkg.com/realm-web@2.0.0/dist/bundle.iife.js"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        .slide-up { animation: slideUp 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans p-4">
    <div id="app" class="max-w-md mx-auto space-y-6 slide-up" style="display: none;">

        <!-- Profile & Balance Section -->
        <div class="bg-white rounded-xl shadow p-5">
            <h2 class="text-xl font-bold mb-2">My Profile</h2>
            <div class="flex justify-between items-center text-gray-700">
                <span id="userName" class="font-medium">Loading...</span>
                <span class="text-green-600 font-bold"><span id="userBalance">0</span> RUB</span>
            </div>
            <p id="subStatus" class="mt-3 text-sm text-gray-500 text-center"></p>
        </div>

        <!-- Top-up Section -->
        <div class="bg-white rounded-xl shadow p-5">
            <h2 class="text-lg font-bold mb-3">Top-up Balance</h2>
            <div class="flex space-x-2">
                <input type="number" id="topupAmount" class="flex-1 border rounded px-3 py-2" placeholder="Amount (RUB)" min="50" max="50000" />
                <button id="btnTopup" class="bg-blue-500 text-white font-bold py-2 px-4 rounded hover:bg-blue-600 transition">Pay</button>
            </div>
            <p id="topupMsg" class="text-xs text-red-500 mt-2 hidden"></p>
        </div>

        <!-- Buy Subscription Section -->
        <div class="bg-white rounded-xl shadow p-5">
            <h2 class="text-lg font-bold mb-3">Buy Subscription</h2>
            <div id="subOptions" class="space-y-3">
                <!-- Buttons injected via JS -->
                <p class="text-gray-500 text-sm italic">Loading prices...</p>
            </div>
            <p id="subMsg" class="text-xs mt-3 text-center"></p>
        </div>

        <!-- Active Configs -->
        <div class="bg-white rounded-xl shadow p-5">
            <h2 class="text-lg font-bold mb-3">My Configs</h2>
            <div id="myConfigs" class="space-y-3 text-sm">
                 <p class="text-gray-500 italic">No configs generated yet.</p>
            </div>
        </div>

    </div>

    <!-- Loader -->
    <div id="loader" class="flex justify-center items-center h-screen fade-in">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
