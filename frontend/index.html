<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Mini App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Realm Web SDK -->
    <script src="https://unpkg.com/realm-web/dist/bundle.iife.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }

        .slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .hidden-view {
            display: none !important;
        }

        /* Loading spinner */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--tg-theme-button-color, #3390ec);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-primary {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
    </style>
</head>
<body class="p-4">

    <!-- Loading Screen -->
    <div id="loadingView" class="fixed inset-0 flex items-center justify-center bg-white/80 z-50">
        <div class="flex flex-col items-center">
            <div class="spinner mb-4"></div>
            <p class="text-gray-600 font-medium" id="loadingText">Loading profile...</p>
        </div>
    </div>

    <!-- Error Screen -->
    <div id="errorView" class="hidden-view fixed inset-0 flex items-center justify-center bg-white z-50 fade-in p-6 text-center">
        <div>
            <div class="text-red-500 text-5xl mb-4">⚠️</div>
            <h2 class="text-xl font-bold mb-2">Error</h2>
            <p id="errorMessage" class="text-gray-600 mb-6"></p>
            <button onclick="window.location.reload()" class="btn-primary w-full py-3 rounded-lg font-medium">Try Again</button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div id="mainView" class="hidden-view fade-in pb-20">

        <!-- Dashboard Tab -->
        <div id="tabDashboard" class="tab-content">
            <div class="bg-gray-100 rounded-xl p-5 mb-6 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-2xl font-bold" id="userName">User</h2>
                    <span class="text-xs bg-blue-100 text-blue-800 py-1 px-2 rounded-full font-bold">VPN</span>
                </div>
                <p class="text-sm text-gray-500 mb-4" id="userId">ID: ---</p>

                <div class="flex justify-between items-center mb-1">
                    <span class="text-gray-600">Balance</span>
                    <span class="text-xl font-bold" id="userBalance">0 ₽</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-600">Subscription</span>
                    <span class="font-medium text-sm" id="userSubscription">No active sub</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <button onclick="showTab('tabTopup')" class="bg-gray-100 p-4 rounded-xl flex flex-col items-center justify-center active:bg-gray-200 transition">
                    <span class="text-2xl mb-1">💳</span>
                    <span class="text-sm font-medium">Top Up</span>
                </button>
                <button onclick="showTab('tabBuy')" class="bg-gray-100 p-4 rounded-xl flex flex-col items-center justify-center active:bg-gray-200 transition">
                    <span class="text-2xl mb-1">📦</span>
                    <span class="text-sm font-medium">Buy VPN</span>
                </button>
            </div>

            <h3 class="text-lg font-bold mb-3">Your Configs</h3>
            <div id="configsList" class="space-y-3">
                <!-- Config items will be injected here -->
            </div>
            <div id="noConfigsMsg" class="text-center text-gray-500 text-sm py-4 hidden">
                You don't have any configs yet.
            </div>
        </div>

        <!-- Buy VPN Tab -->
        <div id="tabBuy" class="tab-content hidden-view">
            <h2 class="text-2xl font-bold mb-1">Buy Subscription</h2>
            <p class="text-gray-500 text-sm mb-6">Current balance: <span id="buyTabBalance" class="font-bold">0 ₽</span></p>

            <div id="subscriptionPlans" class="space-y-4">
                <!-- Subscription plans will be injected here -->
            </div>
        </div>

        <!-- Top Up Tab -->
        <div id="tabTopup" class="tab-content hidden-view">
            <h2 class="text-2xl font-bold mb-1">Top Up Balance</h2>
            <p class="text-gray-500 text-sm mb-6">Current balance: <span id="topupTabBalance" class="font-bold">0 ₽</span></p>

            <div class="grid grid-cols-3 gap-3 mb-6">
                <button onclick="selectTopupAmount(100)" class="bg-gray-100 py-3 rounded-lg font-medium active:bg-gray-200 transition">100 ₽</button>
                <button onclick="selectTopupAmount(200)" class="bg-gray-100 py-3 rounded-lg font-medium active:bg-gray-200 transition">200 ₽</button>
                <button onclick="selectTopupAmount(500)" class="bg-gray-100 py-3 rounded-lg font-medium active:bg-gray-200 transition">500 ₽</button>
                <button onclick="selectTopupAmount(1000)" class="bg-gray-100 py-3 rounded-lg font-medium active:bg-gray-200 transition">1000 ₽</button>
                <button onclick="selectTopupAmount(2000)" class="bg-gray-100 py-3 rounded-lg font-medium active:bg-gray-200 transition">2000 ₽</button>
                <button onclick="selectTopupAmount(5000)" class="bg-gray-100 py-3 rounded-lg font-medium active:bg-gray-200 transition">5000 ₽</button>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Custom Amount</label>
                <input type="number" id="customAmount" placeholder="Enter amount (min 50)" class="w-full bg-gray-100 border-none rounded-lg py-3 px-4 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <button onclick="processTopup()" class="btn-primary w-full py-3 rounded-xl font-bold text-lg shadow-md active:opacity-80 transition">
                Pay with Yookassa
            </button>
        </div>

    </div>

    <!-- Bottom Navigation -->
    <div id="bottomNav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around p-3 hidden-view z-40">
        <button onclick="showTab('tabDashboard')" class="flex flex-col items-center text-gray-500 focus:text-blue-500 w-1/3">
            <span class="text-xl mb-1">🏠</span>
            <span class="text-xs font-medium">Home</span>
        </button>
        <button onclick="showTab('tabBuy')" class="flex flex-col items-center text-gray-500 focus:text-blue-500 w-1/3">
            <span class="text-xl mb-1">🚀</span>
            <span class="text-xs font-medium">Buy</span>
        </button>
        <button onclick="showTab('tabTopup')" class="flex flex-col items-center text-gray-500 focus:text-blue-500 w-1/3">
            <span class="text-xl mb-1">💳</span>
            <span class="text-xs font-medium">Top Up</span>
        </button>
    </div>

    <!-- Realm App logic -->
    <script src="app.js"></script>
</body>
</html>
