<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/realm-web@2.0.0/dist/bundle.iife.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-up { animation: slideUp 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="p-4">
    <div id="app" class="max-w-md mx-auto fade-in">
        <div id="loading" class="text-center mt-10">
            <p class="text-lg">Loading...</p>
        </div>

        <div id="main-content" class="hidden slide-up">
            <h1 class="text-2xl font-bold mb-4">VPN Dashboard</h1>

            <div class="bg-blue-100 rounded-lg p-4 mb-4 text-blue-900 shadow">
                <p class="text-sm">Balance</p>
                <p class="text-2xl font-bold" id="balance-display">0 RUB</p>
                <button id="btn-topup" class="mt-2 bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 transition">Top Up</button>
            </div>

            <div class="bg-green-100 rounded-lg p-4 mb-4 text-green-900 shadow">
                <p class="text-sm">Subscription Status</p>
                <p class="text-xl font-bold" id="sub-status">Not Active</p>
            </div>

            <h2 class="text-xl font-bold mb-2">Buy Subscription</h2>
            <div id="plans-container" class="space-y-3 mb-6">
                <!-- Plans will be populated here -->
            </div>

            <h2 class="text-xl font-bold mb-2">My Configs</h2>
            <div id="configs-container" class="space-y-3">
                <!-- Configs will be populated here -->
            </div>
        </div>

    </div>

    <div id="topup-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg p-6 w-full max-w-sm fade-in text-black">
                <h3 class="text-xl font-bold mb-4">Top Up Balance</h3>
                <input type="number" id="topup-amount" placeholder="Amount (RUB)" class="w-full border rounded p-2 mb-4" min="50">
            <div class="flex justify-end space-x-2">
                <button id="btn-cancel-topup" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Cancel</button>
                <button id="btn-confirm-topup" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Continue</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
