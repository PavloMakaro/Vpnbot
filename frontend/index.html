<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Bot</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Realm Web SDK -->
    <script src="https://unpkg.com/realm-web/dist/bundle.iife.js"></script>
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        .slide-up {
            animation: slideUp 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans p-4 fade-in">
    <div id="app" class="max-w-md mx-auto space-y-6">
        <!-- Header -->
        <header class="text-center slide-up">
            <h1 class="text-2xl font-bold">VPN Bot Panel</h1>
            <p class="text-gray-500 dark:text-gray-400" id="welcome-message">Loading...</p>
        </header>

        <!-- Profile Section -->
        <section id="profile-section" class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow slide-up" style="display: none;">
            <h2 class="text-xl font-semibold mb-2">Ваш профиль</h2>
            <div class="space-y-2">
                <p>Баланс: <span id="balance-value" class="font-bold">0</span> ₽</p>
                <p>Подписка: <span id="subscription-status" class="font-bold">Нет</span></p>
            </div>
            <div class="mt-4 flex space-x-2">
                <button id="btn-topup" class="w-full bg-blue-500 text-white py-2 rounded font-medium hover:bg-blue-600">Пополнить</button>
                <button id="btn-buy" class="w-full bg-green-500 text-white py-2 rounded font-medium hover:bg-green-600">Купить VPN</button>
            </div>
        </section>

        <!-- Buy Section (Hidden by default) -->
        <section id="buy-section" class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow slide-up" style="display: none;">
            <h2 class="text-xl font-semibold mb-4">Выберите подписку</h2>
            <div id="configs-list" class="space-y-3">
                <!-- Config items will be injected here -->
            </div>
            <button id="btn-back-buy" class="mt-4 w-full bg-gray-300 dark:bg-gray-700 text-gray-800 dark:text-gray-200 py-2 rounded font-medium">Назад</button>
        </section>

        <!-- Topup Section (Hidden by default) -->
        <section id="topup-section" class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow slide-up" style="display: none;">
            <h2 class="text-xl font-semibold mb-4">Пополнение баланса</h2>
            <div class="grid grid-cols-2 gap-2 mb-4">
                <button class="topup-amount bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-100 py-2 rounded font-medium" data-amount="100">100 ₽</button>
                <button class="topup-amount bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-100 py-2 rounded font-medium" data-amount="200">200 ₽</button>
                <button class="topup-amount bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-100 py-2 rounded font-medium" data-amount="500">500 ₽</button>
                <button class="topup-amount bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-100 py-2 rounded font-medium" data-amount="1000">1000 ₽</button>
            </div>
            <button id="btn-back-topup" class="w-full bg-gray-300 dark:bg-gray-700 text-gray-800 dark:text-gray-200 py-2 rounded font-medium">Назад</button>
        </section>

        <!-- My Configs Section -->
        <section id="my-configs-section" class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow slide-up" style="display: none;">
            <h2 class="text-xl font-semibold mb-4">Мои конфиги</h2>
            <div id="my-configs-list" class="space-y-3">
                <!-- My config items will be injected here -->
            </div>
        </section>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" style="display: none;">
            <div class="bg-white dark:bg-gray-800 p-4 rounded shadow-lg text-center">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500 mx-auto mb-2"></div>
                <p>Загрузка...</p>
            </div>
        </div>
    </div>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
