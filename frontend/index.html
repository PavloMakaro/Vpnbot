<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Service</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/realm-web@1.2.0/dist/bundle.iife.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white font-sans antialiased">
    <div id="app" class="max-w-md mx-auto p-4 min-h-screen relative pb-20">
        <!-- Header / Profile -->
        <header class="flex items-center justify-between mb-6 p-4 bg-gray-800 rounded-xl shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-xl font-bold">
                    <span id="user-avatar">👤</span>
                </div>
                <div>
                    <h2 id="username" class="font-bold text-lg">Loading...</h2>
                    <p class="text-xs text-gray-400">ID: <span id="user-id">...</span></p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-sm text-gray-400">Balance</p>
                <p id="balance" class="text-xl font-bold text-green-400">0 ₽</p>
            </div>
        </header>

        <!-- Status Banner -->
        <div id="status-banner" class="mb-6 p-3 rounded-lg bg-red-900/50 border border-red-700 text-center">
            <p class="text-sm font-medium text-red-200">Subscription Inactive</p>
            <p id="days-left" class="text-xs text-red-300 mt-1">Tap 'Shop' to buy</p>
        </div>

        <!-- Navigation Tabs -->
        <nav class="flex space-x-1 bg-gray-800 p-1 rounded-lg mb-6 sticky top-2 z-10 shadow-md">
            <button onclick="switchTab('shop')" class="flex-1 py-2 text-sm font-medium rounded-md bg-blue-600 text-white transition-colors" id="tab-shop">Shop</button>
            <button onclick="switchTab('configs')" class="flex-1 py-2 text-sm font-medium rounded-md text-gray-400 hover:text-white transition-colors" id="tab-configs">My Configs</button>
            <button onclick="switchTab('topup')" class="flex-1 py-2 text-sm font-medium rounded-md text-gray-400 hover:text-white transition-colors" id="tab-topup">Top Up</button>
        </nav>

        <!-- Shop Section -->
        <section id="shop-section" class="space-y-4">
            <h3 class="text-lg font-bold mb-2 text-blue-400">Choose a Plan</h3>
            <div id="plans-container" class="space-y-3">
                <!-- Plans will be injected here -->
                <div class="animate-pulse flex space-x-4">
                    <div class="flex-1 space-y-4 py-1">
                        <div class="h-24 bg-gray-700 rounded"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Configs Section -->
        <section id="configs-section" class="hidden space-y-4">
            <h3 class="text-lg font-bold mb-2 text-purple-400">My Configurations</h3>
            <div id="configs-container" class="space-y-3">
                <p class="text-center text-gray-500 py-8">No configurations found.</p>
            </div>
        </section>

        <!-- Top Up Section -->
        <section id="topup-section" class="hidden space-y-4">
            <h3 class="text-lg font-bold mb-2 text-green-400">Add Funds</h3>
            <div class="grid grid-cols-3 gap-3 mb-4">
                <button onclick="selectAmount(100)" class="p-2 bg-gray-800 rounded border border-gray-700 hover:border-green-500">100 ₽</button>
                <button onclick="selectAmount(300)" class="p-2 bg-gray-800 rounded border border-gray-700 hover:border-green-500">300 ₽</button>
                <button onclick="selectAmount(500)" class="p-2 bg-gray-800 rounded border border-gray-700 hover:border-green-500">500 ₽</button>
                <button onclick="selectAmount(1000)" class="p-2 bg-gray-800 rounded border border-gray-700 hover:border-green-500">1000 ₽</button>
            </div>
            <div class="flex space-x-2">
                <input type="number" id="custom-amount" placeholder="Enter amount" class="flex-1 p-3 bg-gray-800 rounded border border-gray-700 focus:outline-none focus:border-blue-500 text-white">
                <button onclick="initiatePayment()" class="px-6 py-3 bg-green-600 rounded font-bold hover:bg-green-700">Pay</button>
            </div>
            <p class="text-xs text-gray-500 mt-2 text-center">Secure payments via Yookassa</p>
        </section>

        <!-- Notification -->
        <div id="notification" class="fixed bottom-4 left-4 right-4 bg-gray-800 border border-gray-700 p-4 rounded-lg shadow-xl transform translate-y-20 transition-transform duration-300 z-50 flex items-center justify-between hidden">
            <span id="notif-message" class="text-sm">Notification</span>
            <button onclick="hideNotification()" class="text-gray-400 hover:text-white">✕</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
